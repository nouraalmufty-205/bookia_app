$kind: http-request
url: "{{local}}/add-to-wishlist"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "product_id" : 49
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
settings: {}
examples: ./.resources/Add To Wishlist.resources/examples
order: 1000
