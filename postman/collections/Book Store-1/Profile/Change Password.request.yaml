$kind: http-request
url: "{{local}}/update-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: current_password
      value: "123456789"
    - type: text
      key: new_password
      value: "123456789"
    - type: text
      key: new_password_confirmation
      value: "123456789"
auth:
  type: bearer
  credentials:
    token: "{{vault:authorization-secret}}"
settings: {}
examples: ./.resources/Change Password.resources/examples
order: 3000
