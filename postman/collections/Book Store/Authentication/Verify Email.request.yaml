$kind: http-request
url: "{{local}}/verify-email"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: formdata
  content:
    - type: text
      key: verify_code
      value: "392102"
auth:
  type: bearer
  credentials:
    token: "{{vault:authorization-secret}}"
settings: {}
examples: ./.resources/Verify Email.resources/examples
order: 8000
