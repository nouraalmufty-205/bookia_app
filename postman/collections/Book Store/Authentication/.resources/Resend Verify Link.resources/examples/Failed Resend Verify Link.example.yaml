$kind: http-example
request:
  url: "{{local}}/resend-verify-code"
  method: GET
  headers:
    Accept: application/json
    Content-Type: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Host
      value: 127.0.0.1:8000
    - key: Date
      value: Sun, 06 Aug 2023 12:03:07 GMT
    - key: Date
      value: Sun, 06 Aug 2023 12:03:07 GMT
    - key: Connection
      value: close
    - key: X-Powered-By
      value: PHP/8.2.0
    - key: Cache-Control
      value: max-age=3600, public
    - key: Content-Type
      value: application/json
    - key: phpdebugbar
      value: "%7B%22error%22%3A%22Maximum%20header%20size%20exceeded%22%7D"
    - key: Access-Control-Allow-Origin
      value: "*"
  body:
    type: json
    content: |-
      {
          "data": [],
          "message": "غير مسجل",
          "error": [],
          "status": 401
      }
order: 3000
